AWSTemplateFormatVersion: "2010-09-09"
Description: "NFLPredictor - ECS Fargate Deployment"

Parameters:
  S3BucketName:
    Type: String
    Default: "nfl-predictor-bucket"
  ContainerImage:
    Type: String
    Default: "ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/nfl-predictor:latest"
  NFLSeason:
    Type: Number
    Default: 2024
  Environment:
    Type: String
    Default: "prod"
    AllowedValues: ["prod", "test", "dev"]
  OddsApiKeyArn:
    Type: String
    Description: "ARN of the Odds API key secret in Secrets Manager"
    Default: "arn:aws:secretsmanager:us-east-1:033896355668:secret:odds-api-key"

Resources:

  # ── S3 Bucket ───────────────────────────────────────────────────────────
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: "CleanOldModels"
            Status: Enabled
            Prefix: "models/"
            NoncurrentVersionExpirationInDays: 30

  # ── ECS Cluster ─────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "nfl-predictor-${Environment}"

  # ── Task Execution Role ─────────────────────────────────────────────────
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"]
                Resource:
                  - !Sub "arn:aws:s3:::${S3BucketName}"
                  - !Sub "arn:aws:s3:::${S3BucketName}/*"
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource: !Sub "${OddsApiKeyArn}*"

  # ── Task Definition ─────────────────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "nfl-predictor-${Environment}"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "2048"
      Memory: "8192"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: nfl-predictor
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: S3_BUCKET
              Value: !Ref S3BucketName
            - Name: NFL_SEASON
              Value: !Ref NFLSeason
            - Name: LOG_LEVEL
              Value: INFO
          Secrets:
            - Name: ODDS_API_KEY
              ValueFrom: !Ref OddsApiKeyArn
          HealthCheck:
            Command: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
            Interval: 60
            Timeout: 30
            StartPeriod: 120
            Retries: 5
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/nfl-predictor-${Environment}"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  # ── ECS Service ─────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 300
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: false
          Rollback: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !Sub "{{resolve:ssm:/nfl-predictor/${Environment}/subnets}}"]
          SecurityGroups: [!Ref ECSSecurityGroup]

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "NFLPredictor ECS"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0

  # ── Weekly Retrainer Lambda ──────────────────────────────────────────────
  RetrainerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "nfl-predictor-retrain-${Environment}"
      Handler: model_retrainer.handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 4096
      Role: !GetAtt TaskExecutionRole.Arn
      Environment:
        Variables:
          S3_BUCKET: !Ref S3BucketName
          NFL_SEASON: !Ref NFLSeason

  # Run every Tuesday at 6 AM UTC (after Monday Night Football)
  WeeklyRetrainSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 6 ? * TUE *)"
      State: ENABLED
      Targets:
        - Arn: !GetAtt RetrainerFunction.Arn
          Id: "WeeklyRetrain"
          Input: '{"target": "over_total"}'

  # ── CloudWatch Log Group ─────────────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/nfl-predictor-${Environment}"
      RetentionInDays: 30

Outputs:
  S3BucketName:
    Value: !Ref DataBucket
  ECSClusterName:
    Value: !Ref ECSCluster
  ServiceName:
    Value: !Ref ECSService