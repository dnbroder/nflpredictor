name: Deploy NFL Predictor

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nfl-predictor
  ECS_CLUSTER: nfl-predictor-cluster
  ECS_SERVICE: nfl-predictor-service
  CONTAINER_NAME: app
  CFN_STACK_NAME: nfl-predictor
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------------
      # Step 1: CloudFormation — update infrastructure first
      # ---------------------------------------------------------------
      - name: Deploy CloudFormation stack
        run: |
          echo "Deploying CloudFormation stack: ${{ env.CFN_STACK_NAME }}"
          aws cloudformation deploy \
            --stack-name ${{ env.CFN_STACK_NAME }} \
            --template-file infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}
          echo "CloudFormation stack update complete"

      # ---------------------------------------------------------------
      # Step 2: Build and push Docker image
      # ---------------------------------------------------------------
      - name: Build, tag, and push image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------
      # Step 3: Update ECS task definition and deploy
      # ---------------------------------------------------------------
      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nfl-predictor-task-init \
            --query taskDefinition > task-definition.json

      - name: Clean task definition for registration
        run: |
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          for key in ['compatibilities','taskDefinitionArn','requiresAttributes',
                      'revision','status','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('task-definition.json', 'w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Inject secrets and env vars into task definition
        run: python3 nfl_predictor/patch_task_definition.py task-definition.json

      - name: Verify task definition secrets
        run: |
          echo "=== Secrets in task definition ==="
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          cd = td['containerDefinitions'][0]
          for s in cd.get('secrets', []):
              print(f\"  {s['name']}: {s['valueFrom']}\")
          print('=== Environment vars ===')
          for e in cd.get('environment', []):
              print(f\"  {e['name']}: {e['value']}\")
          "

      - name: Update task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ---------------------------------------------------------------
      # Step 4: Deploy Lambda function code
      # ---------------------------------------------------------------
      - name: Package and deploy Lambdas
        run: |
          echo "=== Packaging predict-weekly Lambda ==="
          zip -j /tmp/predict-weekly-lambda.zip lambda/predict_weekly.py

          echo "=== Packaging operations Lambda ==="
          zip -j /tmp/operations-lambda.zip lambda/operations.py

          echo "=== Deploying predict-weekly Lambda ==="
          aws lambda update-function-code \
            --function-name ${{ env.ECR_REPOSITORY }}-predict-weekly \
            --zip-file fileb:///tmp/predict-weekly-lambda.zip \
            --region ${{ env.AWS_REGION }} \
            --publish

          echo "=== Deploying operations Lambda ==="
          aws lambda update-function-code \
            --function-name ${{ env.ECR_REPOSITORY }}-operations \
            --zip-file fileb:///tmp/operations-lambda.zip \
            --region ${{ env.AWS_REGION }} \
            --publish

          echo "Both Lambdas deployed"

      # ---------------------------------------------------------------
      # Step 5: Verify deployment
      # ---------------------------------------------------------------
      - name: Deployment complete
        run: |
          echo "========================================="
          echo "NFL Predictor deployment complete"
          echo "  CloudFormation: ${{ env.CFN_STACK_NAME }}"
          echo "  ECS: ${{ env.ECS_CLUSTER }}/${{ env.ECS_SERVICE }}"
          echo "  Lambda: ${{ env.ECR_REPOSITORY }}-predict-weekly"
          echo "========================================="