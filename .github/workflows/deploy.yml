name: Deploy NFL Predictor

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nfl-predictor
  ECS_CLUSTER: nfl-predictor-cluster
  ECS_SERVICE: nfl-predictor-service
  CONTAINER_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/mlb-cicd-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Build, tag, and push image
        id: build-image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition nfl-predictor-task-init \
            --query taskDefinition > task-definition.json

      - name: Clean task definition for registration
        run: |
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          for key in ['compatibilities','taskDefinitionArn','requiresAttributes',
                      'revision','status','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('task-definition.json', 'w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Inject secrets and env vars into task definition
        run: python3 nfl_predictor/patch_task_definition.py task-definition.json

      - name: Verify task definition secrets
        run: |
          echo "=== Secrets in task definition ==="
          python3 -c "
          import json
          with open('task-definition.json') as f:
              td = json.load(f)
          cd = td['containerDefinitions'][0]
          for s in cd.get('secrets', []):
              print(f\"  {s['name']}: {s['valueFrom']}\")
          print('=== Environment vars ===')
          for e in cd.get('environment', []):
              print(f\"  {e['name']}: {e['value']}\")
          "

      - name: Update task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1.4.0
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.3.0
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment complete
        run: echo "ECS service stable — new container is live"